services:
  postgres:
    image: postgres:16-alpine
    container_name: certprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certprep
      POSTGRES_PASSWORD: certprep_dev
      POSTGRES_DB: certprep
    ports:
      - "5432:5432"
    volumes:
      - certprep_pg_data:/var/lib/postgresql/data

volumes:
  certprep_pg_data:
