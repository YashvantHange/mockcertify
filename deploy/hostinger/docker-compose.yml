# MockCertify on Hostinger VPS — run from repo root:
#   docker compose -f deploy/hostinger/docker-compose.yml --env-file deploy/hostinger/.env up -d --build

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUN_DB_IMPORT: ${RUN_DB_IMPORT:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    build:
      context: ../..
      dockerfile: deploy/hostinger/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: same-origin
      API_PROXY_TARGET: http://api:4000
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  certbot-www:
  certbot-certs:
