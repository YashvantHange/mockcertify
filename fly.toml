# Fly.io — always-on API (uses Neon PostgreSQL via DATABASE_URL secret)
app = "mockcertify-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  CLIENT_URL = "https://mockcertify-web.vercel.app"
  ALLOWED_ORIGINS = "https://mockcertify-web.vercel.app"
  PORT = "4000"
  GOOGLE_OAUTH_ENABLED = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
