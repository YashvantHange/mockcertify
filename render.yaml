# Render Blueprint — MockCertify API + PostgreSQL
# Deploy: https://dashboard.render.com → New → Blueprint → connect repo
services:
  - type: web
    name: mockcertify-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      corepack enable &&
      pnpm install &&
      pnpm db:generate &&
      pnpm --filter @certprep/shared build &&
      pnpm --filter @certprep/database build &&
      pnpm --filter @certprep/api build &&
      cd packages/database && npx prisma db push
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PNPM_VERSION
        value: "9.15.0"
      - key: DATABASE_URL
        fromDatabase:
          name: mockcertify-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: RUN_DB_IMPORT
        value: "true"
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - scripts/**
        - package.json
        - pnpm-lock.yaml
        - render.yaml

databases:
  - name: mockcertify-db
    plan: free
    region: oregon
    databaseName: mockcertify
    user: mockcertify
