# Render Blueprint — MockCertify API (Neon PostgreSQL)
# 1. Deploy: https://render.com/deploy?repo=https://github.com/YashvantHange/mockcertify
# 2. Set DATABASE_URL to your Neon connection string (GitHub secret DATABASE_URL or Neon dashboard)
services:
  - type: web
    name: mockcertify-api
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/YashvantHange/mockcertify
    branch: master
    buildCommand: >-
      pnpm install &&
      pnpm db:generate &&
      pnpm --filter @certprep/shared build &&
      pnpm --filter @certprep/database build &&
      pnpm --filter @certprep/api build &&
      cd packages/database && npx prisma db push
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PNPM_VERSION
        value: "9.15.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://mockcertify-web.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://mockcertify-web.vercel.app
      - key: ADMIN_PASSWORD
        value: Admin123!@#
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GOOGLE_OAUTH_ENABLED
        value: "true"
      - key: RUN_DB_IMPORT
        value: "true"
